services:
  verigate:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - verigate-data:/app/data
      - verigate-keys:/app/keys
    environment:
      VERIGATE_POLICY: /app/policies/default.yaml
      VERIGATE_API_KEYS: "${VERIGATE_API_KEYS:?Set VERIGATE_API_KEYS before starting Verigate}"
      VERIGATE_REQUIRE_AUTH: "1"
      VERIGATE_REQUIRE_SIGNED_INTENT: "1"

volumes:
  verigate-data:
  verigate-keys:
