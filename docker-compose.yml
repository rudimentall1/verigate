services:
  verigate:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - verigate-data:/app/data
      - verigate-keys:/app/keys
    environment:
      VERIGATE_POLICY: /app/policies/default.yaml
      VERIGATE_API_KEYS: "${VERIGATE_API_KEYS:?Set VERIGATE_API_KEYS before starting Verigate}"
      VERIGATE_ENV: "production"
      VERIGATE_REQUIRE_AUTH: "1"
      VERIGATE_REQUIRE_SIGNED_INTENT: "1"
      VERIGATE_REQUIRE_ENCRYPTED_KEY: "1"
      VERIGATE_KEY_PASSPHRASE: "${VERIGATE_KEY_PASSPHRASE:?Set VERIGATE_KEY_PASSPHRASE before starting Verigate}"
      # Arc Mainnet Registry verification fails closed if the pinned runtime hash is empty or incorrect.
      VERIGATE_ARC_RPC_URL: "${VERIGATE_ARC_RPC_URL:-https://rpc.mainnet.arc.io}"
      VERIGATE_ARC_REGISTRY_ADDRESS: "${VERIGATE_ARC_REGISTRY_ADDRESS:-0x4D09CdD490c1Ce48BCB6dA5c1A6Bf41E2f5e853D}"
      VERIGATE_ARC_ISSUER_ADDRESS: "${VERIGATE_ARC_ISSUER_ADDRESS:-0x1429906b663608DB6aDeAb8F975B47aFbbe8c68C}"
      VERIGATE_ARC_REGISTRY_CODE_HASH: "${VERIGATE_ARC_REGISTRY_CODE_HASH:-0x6b229c049b9ba0007c318a10759a9827b5a798a4e511611872dcd4cf3973b160}"

volumes:
  verigate-data:
  verigate-keys:
