name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        env:
          VERIGATE_ENV: development
          VERIGATE_ALLOW_INSECURE_DEV_MODE: "1"
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v

      - name: Cross-language Agent SDK and Arc wallet client test
        run: PYTHONPATH=. node --test tests/agent-sdk-arc-client.test.mjs

      - name: Run the end-to-end demo
        run: PYTHONPATH=. python3 demo.py

      - name: Smoke-check the API app
        run: PYTHONPATH=. python3 -c "from api.main import app; print('API app OK:', app.title)"

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install contract tooling
        run: npm ci

      - name: Report full and production npm advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          python3 - "$RUNNER_TEMP/npm-audit-full.json" "$RUNNER_TEMP/npm-audit-production.json" <<'PY'
          import json
          import sys

          for label, path in zip(("all dependencies", "production dependencies"), sys.argv[1:]):
              with open(path, encoding="utf-8") as handle:
                  report = json.load(handle)
              metadata = report.get("metadata", {}).get("vulnerabilities", {})
              print(f"\\n{label}: {metadata}")
              for name, item in sorted(report.get("vulnerabilities", {}).items()):
                  via = item.get("via", [])
                  advisory_names = [
                      v.get("title", v.get("name", "unknown")) if isinstance(v, dict) else v
                      for v in via
                  ]
                  print(json.dumps({
                      "package": name,
                      "severity": item.get("severity"),
                      "isDirect": item.get("isDirect"),
                      "range": item.get("range"),
                      "via": advisory_names,
                      "fixAvailable": item.get("fixAvailable"),
                  }, sort_keys=True))
          PY

      - name: Arc wallet client workflow tests
        run: npm run test:arc-client

      - name: Headless Arc agent executor workflow tests
        run: npm run test:arc-agent-executor

      - name: Constrained Arc signer policy tests
        run: npm run test:arc-constrained-signer

      - name: Arc signer real systemd runtime smoke test
        run: sudo -n bash tests/arc-signer-systemd-runtime-smoke.sh

      - name: Arc signer daemon mock-RPC systemd smoke test
        run: sudo -n bash tests/arc-signer-daemon-systemd-smoke.sh

      - name: Arc signer full issuer-agent flow under systemd (local mock RPC)
        run: sudo -n bash tests/arc-signer-full-flow-systemd-smoke.sh

      - name: Measure historical Arc Registry gas costs (read-only)
        run: npm run verify:arc-fee-samples

      - name: Atomic-state end-to-end test
        run: npm run test:atomic

      - name: Compile Arc Authority Registry
        run: npm run compile:arc-authority

      - name: Guard access-control test
        run: npm run test:guard

      - name: Verify Arc signer production-only installation
        run: |
          npm ci --omit=dev --ignore-scripts
          npm ls --omit=dev --all --json > "$RUNNER_TEMP/npm-production-tree.json"
          python3 - "$RUNNER_TEMP/npm-production-tree.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              tree = json.load(handle)

          audit_only_packages = {
              "@microsoft/api-extractor",
              "@microsoft/api-extractor-model",
              "@microsoft/tsdoc-config",
              "@rushstack/node-core-library",
              "ajv",
              "bn.js",
              "brace-expansion",
              "braces",
              "browserify-sign",
              "browserslist",
              "cipher-base",
              "cross-spawn",
              "diff",
              "js-yaml",
              "json5",
              "micromatch",
              "minimatch",
              "mocha",
              "nanoid",
              "pbkdf2",
              "picomatch",
              "semver",
              "serialize-javascript",
              "sha.js",
              "terser-webpack-plugin",
              "validator",
              "webpack",
          }

          found = []

          def walk(node, parent=""):
              for name, dependency in node.get("dependencies", {}).items():
                  path = f"{parent} > {name}" if parent else name
                  if name in audit_only_packages:
                      found.append(path)
                  walk(dependency, path)

          walk(tree)
          if found:
              print("Unexpected audit-only packages in production install:")
              print("\\n".join(found))
              raise SystemExit(1)

          print("Production dependency tree excludes Ganache's 27 bundled audit-only packages: PASS")
          PY
          node --input-type=module -e "await import('./integrations/arc-ethers-signer-adapter.mjs'); console.log('Arc signer runtime imports: PASS')"


  anna-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Anna CLI strict schema-4 manifest validation
        working-directory: anna
        run: npx --yes @anna-ai/cli@0.1.64 validate --strict

      - name: Anna app end-to-end UI test (real app and plugin, scripted LLM)
        env:
          VERIGATE_ENV: development
          VERIGATE_ALLOW_INSECURE_DEV_MODE: "1"
        run: node scripts/test_anna_ui.mjs

      - name: Build and smoke-test Linux Anna Executa binary
        run: |
          pip install pyinstaller
          python anna/build_binary.py
          python anna/smoke_binary.py anna/executas/verigate-authority/dist/verigate-authority "0.1.18"
          python anna/package_binary.py linux-x86_64 "0.1.18"


  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify Compose refuses to start without an API key
        run: |
          if env -u VERIGATE_API_KEYS docker compose config --quiet; then
            echo "::error::Compose accepted a missing VERIGATE_API_KEYS value"
            exit 1
          fi

      - name: Validate protected Compose configuration
        env:
          VERIGATE_API_KEYS: ci-validation-only
          VERIGATE_KEY_PASSPHRASE: ci-only-test-passphrase-32-characters
        run: |
          docker compose config --format json > "$RUNNER_TEMP/verigate-compose.json"
          python3 - "$RUNNER_TEMP/verigate-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              service = json.load(handle)["services"]["verigate"]

          ports = service["ports"]
          assert any(
              port.get("host_ip") == "127.0.0.1"
              and str(port.get("published")) == "8000"
              and int(port.get("target")) == 8000
              for port in ports
          ), ports
          env = service["environment"]
          assert env["VERIGATE_API_KEYS"] == "ci-validation-only"
          assert env["VERIGATE_REQUIRE_AUTH"] == "1"
          assert env["VERIGATE_REQUIRE_SIGNED_INTENT"] == "1"
          assert env["VERIGATE_ENV"] == "production"
          assert env["VERIGATE_REQUIRE_ENCRYPTED_KEY"] == "1"
          assert env["VERIGATE_ARC_RPC_URL"] == "https://rpc.mainnet.arc.io"
          assert env["VERIGATE_ARC_REGISTRY_ADDRESS"] == "0x4D09CdD490c1Ce48BCB6dA5c1A6Bf41E2f5e853D"
          assert env["VERIGATE_ARC_ISSUER_ADDRESS"] == "0x1429906b663608DB6aDeAb8F975B47aFbbe8c68C"
          assert env["VERIGATE_ARC_REGISTRY_CODE_HASH"] == "0x6b229c049b9ba0007c318a10759a9827b5a798a4e511611872dcd4cf3973b160"
          assert "VERIGATE_KEY_PASSPHRASE" in env
          PY

      - name: Build production container image
        run: docker build --pull --tag verigate:ci .

      - name: Smoke-test container API authentication
        env:
          VERIGATE_API_KEYS: ci-validation-only
          VERIGATE_KEY_PASSPHRASE: ci-only-test-passphrase-32-characters
        run: |
          docker run --detach --name verigate-ci \
            --publish 127.0.0.1:18000:8000 \
            --env "VERIGATE_API_KEYS=${VERIGATE_API_KEYS}" \
            --env "VERIGATE_KEY_PASSPHRASE=${VERIGATE_KEY_PASSPHRASE}" \
            verigate:ci
          trap 'docker rm --force verigate-ci >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          without_key=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18000/v1/execution/networks)
          test "$without_key" = "401"

          with_key=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERIGATE_API_KEYS}" \
            http://127.0.0.1:18000/v1/execution/networks)
          test "$with_key" = "200"
