name: Build Anna Executa binaries

on:
  push:
    branches:
      - integrate/anna-0.1.9-mainline
    paths:
      - ".github/workflows/anna-executa-binaries.yml"
      - "anna/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      version:
        description: "Executa version to build"
        required: true
        default: "0.1.12"
        type: string
      publish_release:
        description: "Create a GitHub Release after all platform builds pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: windows-x86_64
            runner: windows-latest
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure static OpenSSL for Intel macOS
        if: matrix.target == 'darwin-x86_64'
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          python -m pip cache remove cryptography || true

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build frozen Executa
        run: python anna/build_binary.py

      - name: Package binary
        run: python anna/package_binary.py "${{ matrix.target }}" "${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.12' }}"

      - name: Smoke-test extracted release package
        run: python anna/smoke_package.py "${{ matrix.target }}" "${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.12' }}"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: verigate-authority-${{ matrix.target }}
          path: |
            anna/executas/verigate-authority/dist/verigate-authority-${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.12' }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/integrate/anna-0.1.9-mainline') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: verigate-authority-*
          merge-multiple: true

      - name: Create or refresh candidate GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.12' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG="anna-verigate-authority-v${VERSION}"
          TITLE="Verigate Authority Executa v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" == "true" ]]; then
              gh release upload "$TAG" release-assets/* --clobber
              gh release edit "$TAG" --title "$TITLE"
            else
              echo "Refusing to overwrite an existing published release: $TAG" >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            gh release create "$TAG" release-assets/* \
              --title "$TITLE" --generate-notes --draft
          else
            gh release create "$TAG" release-assets/* \
              --title "$TITLE" --generate-notes
          fi
